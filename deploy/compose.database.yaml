# Isolated database lifecycle: deploying the web app never replaces its volume.
name: mangata-commerce
services:
  db:
    image: postgres:17.11-alpine
    container_name: mangata_db
    restart: unless-stopped
    env_file: /opt/mangata/shared/database.env
    command: ["postgres", "-c", "max_connections=30", "-c", "shared_buffers=128MB", "-c", "password_encryption=scram-sha-256"]
    volumes:
      - data:/var/lib/postgresql/data
      - ./commerce-schema.sql:/docker-entrypoint-initdb.d/10-schema.sql:ro
      - ./commerce-role.sql:/docker-entrypoint-initdb.d/20-role.sql:ro
    networks:
      private:
        aliases: [mangata_db]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mangata_bootstrap -d mangata"]
      interval: 10s
      timeout: 4s
      retries: 6
    security_opt: ["no-new-privileges:true"]
    pids_limit: 100
    mem_limit: 512m
    cpus: 0.5
    shm_size: 128mb
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
networks:
  private:
    name: mangata_private
    external: true
volumes:
  data:
    name: mangata_postgres_data
