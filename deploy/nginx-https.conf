# Enable only after both hostnames have a verified TLS certificate.
# BEGIN MANGATA HTTPS
map "$request_method:$uri" $mangata_checkout_key {
    default "";
    "POST:/api/mp" $binary_remote_addr;
}
limit_req_zone $mangata_checkout_key zone=mangata_checkout:1m rate=3r/m;
log_format mangata_private_log '$remote_addr [$time_local] "$request_method $uri" $status $body_bytes_sent';
server {
    listen 443 ssl;
    http2 on;
    server_name www.mangata.com.ar;
    add_header Strict-Transport-Security "max-age=86400" always;
    ssl_certificate /etc/letsencrypt/live/mangata.com.ar/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mangata.com.ar/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    return 301 https://mangata.com.ar$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name mangata.com.ar;
    add_header Strict-Transport-Security "max-age=86400" always;
    access_log /dev/stdout mangata_private_log;
    limit_req_status 429;

    ssl_certificate /etc/letsencrypt/live/mangata.com.ar/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mangata.com.ar/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    resolver 127.0.0.11 valid=10s ipv6=off;
    set $mangata_upstream http://mangata_web:3000;
    client_max_body_size 64k;
    client_body_timeout 15s;
    client_header_timeout 15s;
    send_timeout 30s;

    gzip on;
    gzip_vary on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location ^~ /api/internal/ { return 404; }

    location / {
        limit_req zone=mangata_checkout burst=2 nodelay;
        proxy_pass $mangata_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Port 443;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_read_timeout 60s;
        proxy_connect_timeout 5s;
        # Preserve Next's Cache-Control and Vary. Never cache carts or checkout.
        proxy_cache off;
    }
}
# END MANGATA HTTPS
